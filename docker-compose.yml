# Local development: the service plus a real Postgres.
#
# The signing keys live in a named volume so that restarting the stack does not
# invalidate every token already in circulation.

name: rust-backend-microservice

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      # Host-side only, for psql and debugging. Override with
      # POSTGRES_PORT=... if 5432 is already taken by a local install.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once on first start, to create the orders database.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The service must not start migrating before Postgres accepts queries.
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth
      BIND_ADDR: 0.0.0.0:8080
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_ISSUER: auth-service
      JWT_AUDIENCE: auth-service-clients
      ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_TOKEN_TTL_SECONDS: "2592000"
      AUTH_RATE_LIMIT_PER_MINUTE: "10"
      RUN_MIGRATIONS: "true"
      RUST_LOG: auth_service=info,tower_http=info
      # Comma-separated. Register with one of these addresses to obtain the
      # first admin token, then clear it.
      ADMIN_BOOTSTRAP_EMAILS: "${ADMIN_BOOTSTRAP_EMAILS:-}"
      # Comma-separated; leave unset to send no CORS headers at all.
      CORS_ALLOWED_ORIGINS: ""
    ports:
      # Host-side only. The container always listens on 8080; change the host
      # side with AUTH_PORT if something else already holds 8080.
      - "${AUTH_PORT:-8080}:8080"
    volumes:
      - auth-keys:/app/keys

  orders-service:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://auth:auth@postgres:5432/orders
      BIND_ADDR: 0.0.0.0:8080
      # On the compose network, so this is the service name rather than localhost.
      AUTH_BASE_URL: http://auth-service:8080
      AUTH_ISSUER: auth-service
      AUTH_AUDIENCE: auth-service-clients
      # `local` verifies the RS256 signature with the auth service's public key.
      # `introspect` calls the auth service on every request, which also honours
      # revocations. See the README for the trade-off.
      TOKEN_CHECK: "${TOKEN_CHECK:-local}"
      REFRESH_COOKIE_TTL_SECONDS: "2592000"
      RUST_LOG: orders_service=info,tower_http=info
      # The demo is served over plain HTTP, where a Secure cookie would be
      # dropped by some browsers.
      COOKIE_SECURE: "false"
    ports:
      - "${ORDERS_PORT:-8082}:8080"

volumes:
  postgres-data:
  auth-keys:
