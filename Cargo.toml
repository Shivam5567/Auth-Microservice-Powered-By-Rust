[workspace]
resolver = "3"
members = ["crates/common", "services/auth-service"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
common = { path = "crates/common" }

argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.22"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rand = "0.8"
rsa = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "uuid",
  "time",
  "migrate",
  "macros",
] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "parsing", "formatting"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
  "trace",
  "cors",
  "timeout",
  "request-id",
  "limit",
  "util",
] }
tower_governor = { version = "0.8.0", default-features = false, features = [
  "axum",
  "tracing",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", default-features = false, features = [
  "postgres",
] }

# RSA-2048 key generation is unusably slow in unoptimized builds. Raising the
# opt-level for just the bignum dependency keeps `cargo run` startup fast while
# leaving the rest of the dev profile unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
